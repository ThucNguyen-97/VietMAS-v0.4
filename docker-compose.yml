services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vietmas
      POSTGRES_USER: vietmas
      POSTGRES_PASSWORD: vietmas_dev_password
    ports:
      - "5432:5432"
    volumes:
      - vietmas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietmas -d vietmas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://vietmas:vietmas_dev_password@postgres:5432/vietmas
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      APP_SECRET: ${APP_SECRET:-local-only-change-this-secret}
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vietmas_postgres_data:
